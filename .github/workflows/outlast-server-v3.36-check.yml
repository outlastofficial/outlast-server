name: OUTLAST server v3.36 checks
on:
  push:
    branches: [main, testing]
    paths:
      - 'server.js'
      - 'ai-assistant.js'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/outlast-server-v3.36-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.js
      - name: Focused AI setup regression
        run: node --test tests/ai-assistant.test.js
      - name: Live content schedule tests
        if: always()
        run: node --test tests/live-content-schedule.test.js
      - name: Map registry tests
        if: always()
        run: node --test tests/map-registry-v410.test.js
      - name: Owner access tests
        if: always()
        run: node --test tests/owner-access-v3360.test.js
      - name: Package version
        if: always()
        run: node -e "const p=require('./package.json'); if(p.version!=='4.2.0') throw new Error('server package version mismatch')"
      - name: Map registry and version check
        if: always()
        run: node tests/map-registry-v410.test.js
