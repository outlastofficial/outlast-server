name: OUTLAST server v3.36 checks
on:
  push:
    branches: [main, testing]
    paths:
      - 'server.js'
      - 'ai-assistant.js'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/outlast-server-v3.36-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.js
      - name: Full server regression suite
        run: npm test
      - name: Package version
        run: node -e "const p=require('./package.json'); if(p.version!=='4.1.0') throw new Error('server package version mismatch')"
      - name: Map registry and version check
        run: node tests/map-registry-v410.test.js
