name: OUTLAST server v3.4 checks
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - '.github/workflows/outlast-server-v3.4-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check server
        run: node --check server.js
      - name: Validate package version
        run: node -e "const p=require('./package.json'); if(p.version!=='3.4.0') throw new Error('server package version mismatch')"
      - name: Validate version and endpoints
        run: |
          grep -q "version: '3.4.0'" server.js
          grep -q "/api/challenge/today" server.js
          grep -q "/api/coop/status" server.js
          grep -q "Impossible leaderboard values" server.js
