name: OUTLAST live content scheduler regression
on:
  push:
    branches: [testing]
    paths:
      - 'live-content.js'
      - 'server.js'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/live-content-schedule.yml'
  pull_request:
    branches: [testing]
    paths:
      - 'live-content.js'
      - 'server.js'
      - 'package.json'
      - 'tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Smoke-test the deployed tester schedule API
        run: |
          node --input-type=module -e '
          const r = await fetch("https://outlast-test-server.onrender.com/api/live-content", { cache: "no-store" });
          if (!r.ok) throw new Error("Live content API returned " + r.status);
          const d = await r.json();
          if (!d.ok || !d.smallAddition || !d.weeklyEvent || !d.monthlyEvent || d.timezone !== "UTC") throw new Error("Live content API payload is incomplete");
          console.log("Live content API smoke test passed:", d.smallAddition.title, d.weeklyEvent.title, d.monthlyEvent.title);
          '
