name: OUTLAST live content scheduler regression
on:
  push:
    branches: [testing]
    paths:
      - 'live-content.js'
      - 'server.js'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/live-content-schedule.yml'
  pull_request:
    branches: [testing]
    paths:
      - 'live-content.js'
      - 'server.js'
      - 'package.json'
      - 'tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
